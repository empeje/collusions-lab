[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collusions-lab"
version = "0.1.0"
description = "Trusted-monitor benchmark for detecting and disrupting harmful multi-agent coordination (market + software-engineering scenarios)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]
inspect = [
    "inspect-ai>=0.3.282",
]
space = [
    "gradio>=4.44",
    "huggingface_hub>=0.24",
    "transformers>=4.44",
    "pandas",
    "plotly",
]

[tool.setuptools.packages.find]
include = ["collusions_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]

[[tool.mypy.overrides]]
module = ["yaml", "huggingface_hub", "transformers"]
ignore_missing_imports = true
